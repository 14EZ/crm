<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHC Field CRM</title>
<meta name="theme-color" content="#1f4d3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d2321; --muted:#68706b; --line:#e2ddd1; --line2:#d3ccbc;
  --brand:#1f4d3f; --brand2:#2f6b57; --brand-soft:#e3ece6;
  --amber:#b7791f; --amber-soft:#fbefd5; --green:#2f7a4f; --green-soft:#e1f0e6;
  --gray:#7b817d; --gray-soft:#eceae4; --red:#b23a2e; --red-soft:#f8e2de; --blue:#2a5d8f;
  --r:12px; --shadow:0 1px 2px rgba(29,35,33,.06),0 4px 14px rgba(29,35,33,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header.top .logo{font-weight:700;letter-spacing:.2px;font-size:16px;display:flex;align-items:center;gap:8px}
header.top .logo i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#f2c14e;color:var(--brand);font-style:normal;font-size:13px;font-weight:700}
header.top .sync{margin-left:auto;font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
header.top .sync b{width:8px;height:8px;border-radius:50%;background:#9bd3a9;display:inline-block}
header.top .sync.warn b{background:#f2c14e}
nav.tabs{display:flex;gap:4px;padding:0 12px;background:var(--brand);position:sticky;top:46px;z-index:19}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:#cfe0d7;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:#fff;border-bottom-color:#f2c14e}
main{max-width:1100px;margin:0 auto;padding:16px 14px 90px}
@media (max-width:700px){
  nav.tabs{position:fixed;bottom:0;top:auto;left:0;right:0;padding:0 0 env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);justify-content:space-around}
  nav.tabs button{color:var(--muted);border-bottom:0;border-top:3px solid transparent;padding:9px 6px 11px;font-size:13px;flex:1}
  nav.tabs button.on{color:var(--brand);border-top-color:var(--brand)}
  main{padding:12px 10px 96px}
}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
h2{font-size:20px;margin:0}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#e6bdb7}
.btn.ghost{border-color:transparent;background:none}
.btn.wa{background:#e3f6e8;border-color:#bfe3c8;color:#17663a}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.65;margin-left:4px}
.tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--gray-soft);color:var(--muted)}
.tag.active{background:var(--green-soft);color:var(--green)}
.tag.pending{background:var(--amber-soft);color:var(--amber)}
.tag.completed{background:var(--gray-soft);color:var(--gray)}
.tag.skill{background:var(--brand-soft);color:var(--brand)}
.tag.fail{background:var(--red-soft);color:var(--red)}
.tag.pass{background:var(--green-soft);color:var(--green)}
.tag.sched{background:#e4ecf6;color:var(--blue)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],input[type=email],select,textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,107,87,.15)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.card:hover{border-color:var(--line2)}
.card.pending{border-left:5px solid #e0a63a}
.card.active{border-left:5px solid #3d8a5c}
.card.completed{border-left:5px solid #b9bcb8}
.card .addr{font-weight:600;font-size:15px}
.card .meta{color:var(--muted);font-size:13px;margin-top:2px}
.bar{height:6px;border-radius:4px;background:var(--gray-soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand2)}
.bar.over i{background:var(--red)}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:rgba(255,255,255,.4)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.stat b{display:block;font-size:22px;font-family:"IBM Plex Mono",monospace}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.warnbox{background:var(--red-soft);color:#7d2219;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.infobox{background:var(--amber-soft);color:#6e4710;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,25,23,.42);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(680px,100%);height:100%;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.sheet .sh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .sh h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet .sb{padding:14px;display:flex;flex-direction:column;gap:12px}
.sheet .sf{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;justify-content:flex-end}
@media (max-width:700px){.scrim{align-items:flex-end}.sheet{height:94%;border-radius:16px 16px 0 0;width:100%}}
.dialog{position:fixed;inset:0;z-index:80;background:rgba(20,25,23,.45);display:grid;place-items:center;padding:16px}
.dialog .box{background:var(--panel);border-radius:14px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.checks{display:flex;flex-direction:column}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.checks label:last-child{border-bottom:0}
.checks input{width:18px;height:18px;margin-top:1px;accent-color:var(--brand);flex:0 0 auto}
.checks label.done span{color:var(--muted);text-decoration:line-through}
.checks .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:42px;height:24px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cfcabd;border-radius:999px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--brand2)}
.sw input:checked+span:before{transform:translateX(18px)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:9px 10px;background:#fff;border:1px solid var(--line);border-radius:10px}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--muted)}
.pickl{max-height:240px;overflow:auto;border:1px solid var(--line2);border-radius:9px;background:#fff}
.pickl label{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.pickl label:last-child{border-bottom:0}
.pickl input{accent-color:var(--brand);width:17px;height:17px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--gray-soft);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:0 0 auto}
.section-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.section-title h3{margin:0}
/* map */
.mapwrap{display:grid;grid-template-columns:1fr 300px;gap:12px;height:calc(100vh - 170px);min-height:480px}
@media (max-width:860px){.mapwrap{grid-template-columns:1fr;height:auto}.mapbox{height:62vh}}
.mapbox{position:relative;background:#e9efe6;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
.mapbox svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.mapbox svg.dragging{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-size:18px;font-weight:600;cursor:pointer}
.mappop{position:absolute;left:10px;bottom:10px;right:10px;max-width:360px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.maplegend{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);border-radius:9px;padding:6px 9px;font-size:12px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:8px;overflow:auto}
.calc-out{background:var(--brand);color:#fff;border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc-out b{display:block;font-size:24px;font-family:"IBM Plex Mono",monospace}
.calc-out span{font-size:12px;opacity:.8}
.surf{display:grid;grid-template-columns:1.3fr 1fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.surf input,.surf select{padding:7px 8px}
@media (max-width:560px){.surf{grid-template-columns:1fr 1fr 1fr auto}.surf .nm{grid-column:1/-1}}
.log{font-size:14px}
.log .e{padding:7px 0;border-bottom:1px solid var(--line)}
.log .e small{color:var(--muted);display:block;font-size:12px}
.pill-btns{display:flex;gap:6px;flex-wrap:wrap}
.hidden{display:none!important}
</style>
</head>
<body>

  <div class="logo"><i>CH</i> Field CRM</div>

  <button data-tab="contractors">Contractors</button>
  <button data-tab="map">Map</button>
  <button data-tab="office">Office</button>
</nav>
<main id="main"></main>
<div id="layer"></div>

/* ============ device file storage (IndexedDB) ============ */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open("chc-crm-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("files",mode);const st=t.objectStore("files");let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
  put(id,blob){return this.tx("readwrite",st=>st.put(blob,id))},
  get(id){return this.tx("readonly",st=>st.get(id))},
  del(id){return this.tx("readwrite",st=>st.delete(id))},
  keys(){return this.tx("readonly",st=>st.getAllKeys())}
};
const localAssets={
  async upload(f,opts){const id="local-"+uid();const blob=opts&&opts.type?new Blob([f],{type:opts.type}):f;await IDB.put(id,blob);return{id,sizeBytes:f.size,contentType:blob.type||f.type||"application/octet-stream"}},
  async delete(id){await IDB.del(id);const u=URLS.get(id);if(u)URL.revokeObjectURL(u);URLS.delete(id);return{deleted:true}}
};
const URLS=new Map();
function fileUrl(id){
  if(MODE==="db")return "/_blob/"+id;
  if(URLS.has(id))return URLS.get(id)||"#";
  URLS.set(id,"");
  IDB.get(id).then(b=>{if(b){URLS.set(id,URL.createObjectURL(b));render()}}).catch(()=>{});
  return "#";
}
function hasIDB(){try{return !!window.indexedDB}catch(e){return false}}

/* ============ storage ============ */
const LSKEY="chc-crm-v1";
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LSKEY)||"{}");for(const c of COLS)S[c]=d[c]||[];S.settings=d.settings||{}}catch(e){}}
function lsSave(){try{localStorage.setItem(LSKEY,JSON.stringify({projects:S.projects,contractors:S.contractors,teams:S.teams,office:S.office,settings:S.settings}))}catch(e){}}
const chains={};
function serial(key,fn){const p=(chains[key]||Promise.resolve()).then(fn,fn);chains[key]=p.catch(()=>{});return p}
function strip(o){const c={...o};delete c.id;return JSON.parse(JSON.stringify(c))}
async function save(col,obj){
  obj.updatedAt=now(); if(!obj.createdAt)obj.createdAt=obj.updatedAt;
  if(!obj.id)obj.id=MODE==="db"?DB.collection(col).doc().id:uid();
  const arr=S[col];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);
  render();
  if(MODE==="db"){
    try{await serial(col+"/"+obj.id,()=>DB.collection(col).doc(obj.id).set(strip(obj)))}catch(e){handleWriteErr(e)}
  }else lsSave();
  return obj;
}
async function remove(col,id){
  S[col]=S[col].filter(x=>x.id!==id);render();
  if(MODE==="db"){try{await serial(col+"/"+id,()=>DB.collection(col).doc(id).delete())}catch(e){handleWriteErr(e)}}else lsSave();
}
async function saveSettings(patch){
  S.settings={...S.settings,...patch};render();
  if(MODE==="db"){try{await serial("settings",()=>DB.doc("settings/main").set(JSON.parse(JSON.stringify(S.settings))))}catch(e){handleWriteErr(e)}}else lsSave();
}
function handleWriteErr(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")toast("Storage is full — delete some old records.");
  else if(c==="invalid_argument")toast("You don't have permission to save here.");
  else toast("Couldn't save — check your connection.");
}
function setSync(text,warn){const el=$("#sync");el.classList.toggle("warn",!!warn);el.querySelector("span").textContent=text}

async function initStorage(){
  lsLoad();
  render();
  if(!window.claude||typeof window.claude.use!=="function"){ASSETS=hasIDB()?localAssets:null;setSync("Saved on this device",true);render();return}
  try{DB=await window.claude.use("db")}catch(e){DB=null}
  try{ASSETS=await window.claude.use("assets")}catch(e){ASSETS=null}
  if(!DB){ASSETS=hasIDB()?localAssets:null;setSync("Saved on this device",true);render();return}
  MODE="db";
  for(const c of COLS)S[c]=[];
  S.settings={};
  setSync("Loading…",true);
  const timer=setTimeout(()=>setSync("Can't reach data yet",true),10000);
  let pending=COLS.length+1;
  const done=meta=>{if(meta&&meta.fromCache)return;pending--; if(pending<=0){clearTimeout(timer);setSync("Synced")}};
  const seen={};
  for(const c of COLS){
    DB.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded[c]=true;
      if(!seen[c]&&!snap.metadata.fromCache){seen[c]=1;done(snap.metadata)}
      render();
    },err=>{clearTimeout(timer);setSync("Offline — changes may not save",true)});
  }
  DB.doc("settings/main").onSnapshot(snap=>{
    S.settings=snap.exists?{...snap.data()}:{};
    if(!seen.settings&&!snap.metadata.fromCache){seen.settings=1;done(snap.metadata)}
    render();
  },err=>{});
  render();
}

/* ============ derived ============ */
function teamOf(c){return c&&c.teamId?byId("teams",c.teamId):null}
function membersOf(teamId){return S.contractors.filter(c=>c.teamId===teamId)}
function projectsOfContractor(cid){return S.projects.filter(p=>(p.contractorIds||[]).includes(cid))}
function projectsOfTeam(tid){const ids=membersOf(tid).map(c=>c.id);return S.projects.filter(p=>(p.contractorIds||[]).some(x=>ids.includes(x)))}
function load(unit){ // unit: {type:'team'|'solo', id}
  const ps=unit.type==="team"?projectsOfTeam(unit.id):projectsOfContractor(unit.id);
  const active=ps.filter(p=>p.status==="active").length;
  const pending=ps.filter(p=>p.status==="pending").length;
  const limit=unit.type==="team"?Number((byId("teams",unit.id)||{}).jobLimit||0):Number((byId("contractors",unit.id)||{}).jobLimit||0);
  return {active,pending,limit,over:limit>0&&active>limit,full:limit>0&&active>=limit};
}
function unitFor(c){return c.teamId&&byId("teams",c.teamId)?{type:"team",id:c.teamId}:{type:"solo",id:c.id}}
function overloaded(){
  const out=[];
  for(const t of S.teams){const l=load({type:"team",id:t.id});if(l.over)out.push({name:t.name,...l})}
  for(const c of S.contractors){if(c.teamId&&byId("teams",c.teamId))continue;const l=load({type:"solo",id:c.id});if(l.over)out.push({name:c.name,...l})}
  return out;
}
function checkProgress(p){
  const T=templates()[p.jobType]||{done:[]};
  const items=[...(T.done||[]),...((p.extra&&p.extra.done)||[])];
  const ch=(p.checks&&p.checks.done)||{};
  const n=items.filter(i=>ch[i]).length;
  return {n,total:items.length};
}
function coordsOf(p){
  if(typeof p.lat==="number"&&typeof p.lng==="number")return [p.lat,p.lng,true];
  const c=CITIES[p.city];if(!c)return null;
  const h=hash(p.id||p.address);const a=(h%360)*Math.PI/180;const r=0.006+((Math.abs(h)>>8)%10)*0.0012;
  return [c[0]+Math.sin(a)*r,c[1]+Math.cos(a)*r*1.2,false];
}
const salespeople=()=>[...new Set(S.projects.map(p=>p.salesperson).filter(Boolean))].sort();

/* ---------- files ---------- */
const TEXT_TYPES={csv:"text/csv",txt:"text/plain",md:"text/markdown",json:"application/json"};
async function uploadFiles(fileList,cat){
  if(!ASSETS){toast("Uploads aren't available here");return[]}
  const out=[];
  for(const f of fileList){
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    const opts={};if(TEXT_TYPES[ext])opts.type=TEXT_TYPES[ext];else if(!f.type&&ext==="pdf")opts.type="application/pdf";
    toast(`Uploading ${f.name}…`);
    try{const r=await ASSETS.upload(f,opts);out.push({assetId:r.id,name:f.name,size:r.sizeBytes,type:r.contentType,cat,at:now()})}
    catch(e){const c=e&&e.code;toast(c==="unsupported_type"?`${f.name}: use PDF, image, video or text (export Word files as PDF)`:c==="too_large"?`${f.name} is over 20 MB`:c==="quota_or_state"?"Storage full":`Couldn't upload ${f.name}`)}
  }
  return out;
}
function fileRow(f,i,prefix){
  const url=fileUrl(f.assetId);const img=(f.type||"").startsWith("image/");
  const ext=(f.name.split(".").pop()||"").toUpperCase().slice(0,4);
  return `<div class="li">${img?`<img class="thumb" src="${esc(url)}" alt="">`:`<div class="thumb">${esc(ext)}</div>`}
   <div class="grow"><div class="t">${esc(f.name)}</div><div class="s">${esc(f.cat||"")}${f.size?` · ${(f.size/1024/1024).toFixed(1)} MB`:""}</div></div>
   <a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">Open</a>
   ${ASSETS?`<button class="btn sm ghost" data-act="${prefix}-del" data-i="${i}" title="Remove">✕</button>`:""}</div>`;
}

function mapBase(){
  let s=`<rect x="-2000" y="-2000" width="${MAPW+4000}" height="${MAPH+4000}" fill="#e9efe6"/>`;
  // grid
  for(let la=33.4;la<=34.25;la+=0.1){const [,y]=proj(la,0);s+=`<line x1="-2000" x2="${MAPW+2000}" y1="${y}" y2="${y}" stroke="#dde5da" stroke-width="1"/>`}
  for(let ln=-117.8;ln<=-116.8;ln+=0.1){const [x]=proj(0,ln);s+=`<line y1="-2000" y2="${MAPH+2000}" x1="${x}" x2="${x}" stroke="#dde5da" stroke-width="1"/>`}
  for(const [name,pts] of FREEWAYS){
    const d=pts.map((p,i)=>{const [x,y]=proj(p[0],p[1]);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)}).join(" ");
    s+=`<path d="${d}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" class="fw"/><path d="${d}" fill="none" stroke="#e8b04a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="fw2"/>`;
    const mid=pts[Math.floor(pts.length/2)];const [mx,my]=proj(mid[0],mid[1]);
    s+=`<g class="shield" transform="translate(${mx.toFixed(1)},${my.toFixed(1)})"><rect x="-13" y="-9" width="26" height="18" rx="4" fill="#2a5d8f"/><text text-anchor="middle" y="4.5" font-size="11" font-weight="700" fill="#fff" font-family="IBM Plex Sans, system-ui, sans-serif">${name}</text></g>`;
  }
  for(const [n,[la,ln]] of Object.entries(CITIES)){const [x,y]=proj(la,ln);
    s+=`<g class="city" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle r="3.2" fill="#7b817d"/><text x="6" y="4" font-size="12.5" fill="#3e4642" font-weight="600" font-family="IBM Plex Sans, system-ui, sans-serif" paint-order="stroke" stroke="#e9efe6" stroke-width="3">${esc(n)}</text></g>`}
  return s;
}
const PIN_COLORS={"Bathroom remodel":"#2a5d8f","Kitchen remodel":"#b23a2e","Painting":"#8a4fb0","Concrete / Asphalt":"#555","Electrical":"#c48a00","Plumbing":"#1d8a8a","Water damage / Insurance":"#2f7a4f","Flooring":"#a0522d","New construction / ADU":"#1f4d3f","Other":"#68706b"};
function pinsSvg(scale){
  const act=S.projects.filter(p=>p.status==="active");let s="";
  for(const p of act){const c=coordsOf(p);if(!c)continue;const [x,y]=proj(c[0],c[1]);const sel=UI.mapSel===p.id;const col=PIN_COLORS[p.jobType]||"#68706b";const k=scale;
    s+=`<g class="pin" data-pid="${p.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${k})" style="cursor:${UI.mapEdit?"move":"pointer"}">
      <path d="M0 0 C -9 -12 -11 -16 -11 -21 A 11 11 0 1 1 11 -21 C 11 -16 9 -12 0 0Z" fill="${col}" stroke="${sel?"#f2c14e":"#fff"}" stroke-width="${sel?3.5:2}"/>
      <circle cy="-21" r="4.2" fill="#fff"/>${UI.route[p.id]?`<text y="-17" text-anchor="middle" font-size="11" font-weight="700" fill="${col}" font-family="IBM Plex Sans, system-ui, sans-serif">${routeOrder().indexOf(p.id)+1}</text>`:""}</g>`}
  return s;
}
function routeOrder(){return S.projects.filter(p=>p.status==="active"&&UI.route[p.id]).sort((a,b)=>(UI.route[a.id]-UI.route[b.id])).map(p=>p.id)}
function curScale(){const v=UI.mapView||[0,0,MAPW,MAPH];return Math.max(.35,Math.min(1.4,v[2]/MAPW*1.3))}

  $("#mpins").innerHTML=pinsSvg(sc);
  const act=S.projects.filter(p=>p.status==="active");const unplaced=act.filter(p=>!coordsOf(p));

    <div class="panel"><h3>Active jobs (${act.length})</h3><div class="list">${act.map(p=>`<div class="li" style="cursor:pointer;${UI.mapSel===p.id?"border-color:var(--brand2)":""}" data-act="map-pick" data-id="${p.id}"><input type="checkbox" data-act="route-toggle" data-id="${p.id}" ${UI.route[p.id]?"checked":""} style="accent-color:var(--brand);width:17px;height:17px"><div class="grow"><div class="t">${esc(p.address)}</div><div class="s">${esc(p.city||"No city")}${!coordsOf(p)?" · not on map":""}</div></div></div>`).join("")||`<div class="sub">No active jobs.</div>`}</div>

    <div class="sub">Pins sit near the city center. Use <b>Move pins</b> to drag a pin to the exact spot.</div>`;
}
let mapBound=false;
function bindMap(){
  refreshMap();
  const svg=$("#mapsvg");if(!svg||svg.dataset.bound)return;svg.dataset.bound=1;
  const pts=new Map();let start=null,dragPin=null,moved=false;
  const toSvg=(cx,cy)=>{const r=svg.getBoundingClientRect();const v=UI.mapView||[0,0,MAPW,MAPH];const s=Math.max(v[2]/r.width,v[3]/r.height);const ox=v[0]+(v[2]-r.width*s)/2,oy=v[1]+(v[3]-r.height*s)/2;return [ox+(cx-r.left)*s,oy+(cy-r.top)*s,s]};
  const zoomAt=(f,cx,cy)=>{const v=UI.mapView||[0,0,MAPW,MAPH];const [x,y]=toSvg(cx,cy);let w=Math.min(MAPW*1.6,Math.max(60,v[2]*f));let h=w*v[3]/v[2];UI.mapView=[x-(x-v[0])*w/v[2],y-(y-v[1])*h/v[3],w,h];refreshMap()};
  svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
  svg.addEventListener("pointerdown",e=>{
    svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
    const pin=e.target.closest(".pin");
    if(pin&&UI.mapEdit){dragPin=pin.dataset.pid;return}
    start={v:[...(UI.mapView||[0,0,MAPW,MAPH])],x:e.clientX,y:e.clientY,pin:pin&&pin.dataset.pid,dist:null};
    if(pts.size===2){const a=[...pts.values()];start.dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);start.mid=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]}
    svg.classList.add("dragging");
  });
  svg.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(dragPin){moved=true;const [x,y,s]=toSvg(e.clientX,e.clientY);const g=svg.querySelector(`.pin[data-pid="${dragPin}"]`);if(g)g.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${curScale()})`);return}
    if(!start)return;
    if(pts.size===2&&start.dist){const a=[...pts.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(d>0){const f=start.dist/d;start.dist=d;zoomAt(f,start.mid[0],start.mid[1])}moved=true;return}
    const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    const r=svg.getBoundingClientRect();const s=Math.max(start.v[2]/r.width,start.v[3]/r.height);
    UI.mapView=[start.v[0]-dx*s,start.v[1]-dy*s,start.v[2],start.v[3]];
    svg.setAttribute("viewBox",UI.mapView.map(n=>n.toFixed(1)).join(" "));
  });
  const end=e=>{
    pts.delete(e.pointerId);svg.classList.remove("dragging");
    if(dragPin){const id=dragPin;dragPin=null;if(moved){const [x,y]=toSvg(e.clientX,e.clientY);const [lat,lng]=unproj(x,y);const p=byId("projects",id);if(p)save("projects",{...p,lat:+lat.toFixed(5),lng:+lng.toFixed(5)})}return}
    if(start&&!moved&&start.pin){UI.mapSel=start.pin;refreshMap()}
    else if(start&&!moved&&!start.pin&&UI.mapSel){UI.mapSel=null;refreshMap()}
    if(pts.size===0)start=null;
  };
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
}

     "tpl-reset":()=>confirmDlg(`Reset the ${type} template to the default list?`,()=>{const all={...(S.settings.templates||{})};delete all[type];saveSettings({templates:all});closeSheet()})}
  });
}

/* ---------- Tile calculator ---------- */
function tileCalc(pid){
  const st={surfaces:[{name:"Shower walls",l:"",w:"",sign:1},{name:"Floor",l:"",w:"",sign:1}],tw:12,tl:24,mode:"pcs",perBox:"",sqftBox:"",waste:10};
  const p=pid&&byId("projects",pid);
  const parseLen=v=>{v=String(v||"").trim();if(!v)return 0;const m=v.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft)?\s*(?:(\d+(?:\.\d+)?)\s*(?:"|in)?)?$/);if(m)return Number(m[1])+(m[2]?Number(m[2])/12:0);return Number(v)||0};
  const calc=()=>{
    const area=st.surfaces.reduce((a,s)=>a+s.sign*parseLen(s.l)*parseLen(s.w),0);
    const tile=(Number(st.tw)||0)*(Number(st.tl)||0)/144;
    const withW=area*(1+(Number(st.waste)||0)/100);
    const tiles=tile>0?Math.ceil(withW/tile):0;
    let boxes=0;if(st.mode==="pcs"&&Number(st.perBox)>0)boxes=Math.ceil(tiles/Number(st.perBox));if(st.mode==="sqft"&&Number(st.sqftBox)>0)boxes=Math.ceil(withW/Number(st.sqftBox));
    return {area,withW,tile,tiles,boxes};
  };
  const out=()=>{const r=calc();return `<div class="calc-out"><div><span>Area</span><b>${r.area.toFixed(1)}</b><span>sq ft (+${st.waste}% = ${r.withW.toFixed(1)})</span></div><div><span>Tiles</span><b>${r.tiles||"—"}</b><span>pieces incl. waste</span></div><div><span>Boxes</span><b>${r.boxes||"—"}</b><span>${st.mode==="pcs"?"by pieces/box":"by sq ft/box"}</span></div></div>`};
  const summary=()=>{const r=calc();return `Tile calc${p?" — "+p.address:""}\n`+st.surfaces.filter(s=>parseLen(s.l)&&parseLen(s.w)).map(s=>`${s.sign<0?"− ":""}${s.name}: ${s.l} × ${s.w}`).join("\n")+`\nArea: ${r.area.toFixed(1)} sq ft, +${st.waste}% waste = ${r.withW.toFixed(1)} sq ft\nTile ${st.tw}"×${st.tl}" → ${r.tiles} pcs${r.boxes?`, ${r.boxes} boxes`:""}`};
  openSheet({title:"Tile calculator"+(p?" — "+esc(p.address):""),
    body:()=>`<div id="calcout">${out()}</div>
      <div class="panel"><h3>Surfaces</h3><div class="sub" style="margin-bottom:8px">Enter feet (5.5) or feet + inches (5' 6"). Mark windows, niches and the tub as openings to subtract them.</div>
      <div id="surfs">${st.surfaces.map((s,i)=>`<div class="surf"><input class="nm" data-k="name" data-i="${i}" type="text" value="${esc(s.name)}"><input data-k="l" data-i="${i}" type="text" inputmode="decimal" placeholder="Length" value="${esc(s.l)}"><input data-k="w" data-i="${i}" type="text" inputmode="decimal" placeholder="Width / height" value="${esc(s.w)}"><select data-k="sign" data-i="${i}" style="width:auto"><option value="1" ${s.sign>0?"selected":""}>+ Area</option><option value="-1" ${s.sign<0?"selected":""}>− Opening</option></select><button class="btn sm ghost" data-act="surf-rm" data-i="${i}">✕</button></div>`).join("")}</div>
      <div class="pill-btns"><button class="btn sm" data-act="surf-add" data-v="Wall">+ Wall</button><button class="btn sm" data-act="surf-add" data-v="Floor">+ Floor</button><button class="btn sm" data-act="surf-add" data-v="Window / niche" data-sign="-1">− Opening</button></div></div>
      <div class="panel"><h3>Tile</h3><div class="grid2"><div><label class="f">Tile width (in)</label><input type="number" step="any" data-g="tw" value="${st.tw}"></div><div><label class="f">Tile length (in)</label><input type="number" step="any" data-g="tl" value="${st.tl}"></div></div>
      <label class="f">Box size</label><div class="seg" style="margin-bottom:6px"><button data-act="calc-mode" data-v="pcs" class="${st.mode==="pcs"?"on":""}">Pieces per box</button><button data-act="calc-mode" data-v="sqft" class="${st.mode==="sqft"?"on":""}">Sq ft per box</button></div>
      ${st.mode==="pcs"?`<input type="number" data-g="perBox" placeholder="e.g. 8" value="${esc(st.perBox)}">`:`<input type="number" step="any" data-g="sqftBox" placeholder="e.g. 15.5" value="${esc(st.sqftBox)}">`}
      <label class="f">Waste / cuts</label><div class="chips">${[10,12,15,20].map(w=>`<button class="chip ${Number(st.waste)===w?"on":""}" data-act="calc-waste" data-v="${w}">${w}%</button>`).join("")}</div></div>
      <div class="sub">Tip: use 15% for diagonal / herringbone layouts or large-format tile.</div>`,
    foot:`<button class="btn" data-act="calc-copy">Copy</button>${p?`<button class="btn primary" data-act="calc-log">Save to project log</button>`:""}<button class="btn" data-act="sheet-close">Close</button>`,
    after(){const sb=$("#sheet-body");sb.oninput=e=>{const t=e.target;if(t.dataset.k){const s=st.surfaces[Number(t.dataset.i)];s[t.dataset.k]=t.dataset.k==="sign"?Number(t.value):t.value}else if(t.dataset.g){st[t.dataset.g]=t.value}else return;$("#calcout").innerHTML=out()};sb.onchange=sb.oninput},
    onAct:{"surf-add":(el)=>{st.surfaces.push({name:el.dataset.v,l:"",w:"",sign:Number(el.dataset.sign||1)});sheet.refresh(true)},
      "surf-rm":(el)=>{st.surfaces.splice(Number(el.dataset.i),1);sheet.refresh(true)},
      "calc-mode":(el)=>{st.mode=el.dataset.v;sheet.refresh(true)},
      "calc-waste":(el)=>{st.waste=Number(el.dataset.v);sheet.refresh(true)},
      "calc-copy":()=>copy(summary()),
      "calc-log":()=>{const cur=byId("projects",pid);save("projects",{...cur,log:[...(cur.log||[]),{t:now(),text:summary()}]});toast("Saved to log")}},
    static:true
  });
}


/* ============ backup ============ */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function exportBackup(){
  toast("Preparing backup…");
  const files={};
  if(hasIDB()){try{for(const k of (await IDB.keys())||[]){const b=await IDB.get(k);if(b)files[k]=await blobToDataURL(b)}}catch(e){}}
  const data={app:"chc-field-crm",version:1,exportedAt:now(),projects:S.projects,contractors:S.contractors,teams:S.teams,office:S.office,settings:S.settings,files};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`field-crm-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function importBackup(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("That file isn't a valid backup");return}
  if(!d||d.app!=="chc-field-crm"){toast("That file isn't a Field CRM backup");return}
  confirmDlg(`Replace everything on this device with the backup from ${fmtDate(d.exportedAt)}? (${(d.projects||[]).length} projects, ${(d.contractors||[]).length} contractors)`,async()=>{
    for(const c of COLS)S[c]=Array.isArray(d[c])?d[c]:[];
    S.settings=d.settings||{};lsSave();
    if(hasIDB()&&d.files){for(const [k,v] of Object.entries(d.files)){try{const b=await (await fetch(v)).blob();await IDB.put(k,b);URLS.delete(k)}catch(e){}}}
    render();toast("Backup restored");
  });
}

/* ============ sheet / dialog ============ */
function openSheet(cfg){
  closeSheet();
  const L=$("#layer");const wrap=document.createElement("div");wrap.className="scrim";wrap.id="scrim";
  const title=()=>typeof cfg.title==="function"?cfg.title():cfg.title;
  wrap.innerHTML=`<div class="sheet" role="dialog"><div class="sh"><button class="btn sm ghost" data-act="sheet-close" aria-label="Close">✕</button><h2 id="sheet-title">${title()}</h2></div><div class="sb" id="sheet-body">${cfg.body()}</div>${cfg.foot?`<div class="sf">${cfg.foot}</div>`:""}</div>`;
  L.appendChild(wrap);
  wrap.addEventListener("click",e=>{if(e.target===wrap)closeSheet()});
  sheet={cfg,refresh(force){
    if(cfg.static&&!force)return;
    const sb=$("#sheet-body");if(!sb)return;
    // avoid clobbering an open form
    if(!force&&sb.querySelector("form"))return;
    const ae=document.activeElement;const keepId=ae&&ae.id&&sb.contains(ae)?ae.id:null;const val=keepId?ae.value:null;
    const st=sb.parentElement.scrollTop;sb.innerHTML=cfg.body();$("#sheet-title").innerHTML=title();sb.parentElement.scrollTop=st;
    if(keepId){const el=document.getElementById(keepId);if(el){el.value=val;el.focus()}}
    cfg.after&&cfg.after();
  }};
  cfg.after&&cfg.after();
  const first=wrap.querySelector("input[type=text]");if(first&&wrap.querySelector("form")&&window.matchMedia("(min-width:700px)").matches)first.focus();
}
function closeSheet(){const s=$("#scrim");if(s)s.remove();sheet=null}
let dlgActs=null;
function openDialog(html,acts){closeDialog();const d=document.createElement("div");d.className="dialog";d.id="dlg";d.innerHTML=`<div class="box">${html}</div>`;document.body.appendChild(d);dlgActs=acts||{};d.addEventListener("click",e=>{if(e.target===d)closeDialog()})}
function closeDialog(){const d=$("#dlg");if(d)d.remove();dlgActs=null}
function confirmDlg(msg,fn){openDialog(`<p style="margin:0 0 14px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="dlg-close">Cancel</button><button class="btn primary" data-act="dlg-ok">Yes</button></div>`,{"dlg-ok":()=>{closeDialog();fn()}})}

/* ============ events ============ */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==="A"&&el.getAttribute("href")==="#")e.preventDefault();
  if(el.type==="checkbox"&&a==="route-toggle"){e.stopPropagation();}
  if(dlgActs&&dlgActs[a]){dlgActs[a](el,e);return}
  if(sheet&&sheet.cfg.onAct&&sheet.cfg.onAct[a]){sheet.cfg.onAct[a](el,e);return}
  switch(a){
    case "dlg-close":closeDialog();break;
    case "sheet-close":closeSheet();break;
    case "pfilter":UI.pfilter=el.dataset.v;render();break;
    case "project-new":projectForm(null);break;
    case "project-open":e.preventDefault();openProject(id);break;
    case "project-edit":projectForm(byId("projects",id));break;
    case "project-del":confirmDlg("Delete this project and its checklists, inspections and log? Files stay in storage until removed.",async()=>{closeSheet();await remove("projects",id);toast("Project deleted")});break;
    case "contractor-new":contractorForm(null);break;
    case "contractor-open":e.preventDefault();openContractor(id);break;
    case "contractor-edit":contractorForm(byId("contractors",id));break;
    case "contractor-del":confirmDlg("Delete this contractor? They'll be removed from their jobs.",async()=>{closeSheet();for(const p of S.projects.filter(p=>(p.contractorIds||[]).includes(id)))await save("projects",{...p,contractorIds:p.contractorIds.filter(x=>x!==id)});await remove("contractors",id)});break;
    case "team-new":teamForm(null);break;
    case "team-open":e.preventDefault();openTeam(id);break;
    case "team-edit":teamForm(byId("teams",id));break;
    case "team-del":confirmDlg("Delete this team? Members stay as solo contractors.",async()=>{closeSheet();for(const c of membersOf(id))await save("contractors",{...c,teamId:""});await remove("teams",id)});break;
    case "cview":UI.ctab=el.dataset.v;render();break;
    case "tile-calc":tileCalc(el.dataset.pid);break;
    case "copy":copy(el.dataset.text);break;
    case "copy-contact":copy(`${el.dataset.name}\n${fmtPhone(el.dataset.phone)}${el.dataset.note?"\n"+el.dataset.note:""}`);break;
    case "map-edit":UI.mapEdit=!UI.mapEdit;$("#main").innerHTML=viewMap();bindMap();break;
    case "zoom":{const svg=$("#mapsvg");const r=svg.getBoundingClientRect();if(el.dataset.v==="fit"){UI.mapView=null;refreshMap();break}const f=el.dataset.v==="in"?1/1.4:1.4;const v=UI.mapView||[0,0,MAPW,MAPH];const cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;const w=Math.min(MAPW*1.6,Math.max(60,v[2]*f)),h=w*v[3]/v[2];UI.mapView=[cx-w/2,cy-h/2,w,h];refreshMap();break}
    case "map-close":UI.mapSel=null;refreshMap();break;
    case "map-pick":{UI.mapSel=id;const p=byId("projects",id);const c=p&&coordsOf(p);if(c){const [x,y]=proj(c[0],c[1]);const w=Math.min(MAPW,260),h=w*MAPH/MAPW;UI.mapView=[x-w/2,y-h/2,w,h]}refreshMap();break}
    case "route-toggle":{if(UI.route[id])delete UI.route[id];else UI.route[id]=Date.now();refreshMap();break}
    case "route-clear":UI.route={};refreshMap();break;
    case "ocat":UI.ocat=el.dataset.v;render();break;
    case "office-checklist":checklistForm(null);break;
    case "office-open":openChecklist(id);break;
    case "office-edit":{const o=byId("office",id);if(o.kind==="file"){openDialog(`<h3>Rename file</h3><form id="rform"><label class="f">Title</label><input type="text" name="title" value="${esc(o.title)}"><div class="grid2"><div><label class="f">Category</label><select name="cat">${OFFICE_CATS.map(c=>`<option ${o.cat===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label class="f">City</label><input type="text" name="city" value="${esc(o.city)}"></div></div></form><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="dlg-close">Cancel</button><button class="btn primary" data-act="r-save">Save</button></div>`,{"r-save":()=>{const fd=new FormData($("#rform"));save("office",{...o,title:fd.get("title").toString().trim()||o.title,cat:fd.get("cat").toString(),city:fd.get("city").toString().trim()});closeDialog()}})}else checklistForm(o);break}
    case "office-del":{const o=byId("office",id);confirmDlg(`Delete “${o.title}”?`,async()=>{closeSheet();await remove("office",id);if(o.kind==="file"&&ASSETS&&o.assetId){try{await ASSETS.delete(o.assetId)}catch(e){}}});break}
    case "tpl-edit":templateForm(el.dataset.v);break;
    case "save-name":saveSettings({myName:$("#myname").value.trim(),company:$("#mycompany").value.trim()});toast("Saved");break;
    case "backup-export":exportBackup();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="psearch"){UI.psearch=t.value;render()}
  if(t.id==="csearch"){UI.csearch=t.value;render()}
  if(t.id==="osearch"){UI.osearch=t.value;render()}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="backupfile"&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value="";return}
  if(e.target.id==="ofile"){const fl=e.target.files;const up=await uploadFiles(fl,"Other");for(const u of up){const ext=(u.name.split(".").pop()||"").toLowerCase();const guess=/complet/i.test(u.name)?"Completion form":/financ|loan/i.test(u.name)?"Finance form":/inspect/i.test(u.name)?"Inspection checklist":/material/i.test(u.name)?"Material list":(UI.ocat!=="All"?UI.ocat:"Other");await save("office",{kind:"file",title:u.name.replace(/\.[^.]+$/,""),name:u.name,assetId:u.assetId,type:u.type,size:u.size,cat:guess})}if(up.length)toast(`Added ${up.length} file(s) — tap Rename to set the category`)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#dlg"))closeDialog();else closeSheet()}
  if(e.key==="Enter"&&e.target.id==="newcheck"){e.preventDefault();const b=document.querySelector('[data-act="check-add"]');b&&b.click()}});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;go(b.dataset.tab)});
function go(tab){UI.tab=tab;if(location.hash!=="#"+tab)try{history.replaceState(null,"","#"+tab)}catch(e){location.hash=tab}$("#main").innerHTML="";render();window.scrollTo(0,0)}
function fromHash(){const h=(location.hash||"").slice(1);if(["projects","contractors","map","office"].includes(h)&&h!==UI.tab){UI.tab=h;$("#main").innerHTML="";render()}}
window.addEventListener("hashchange",fromHash);
const h0=(location.hash||"").slice(1);if(["projects","contractors","map","office"].includes(h0))UI.tab=h0;
initStorage();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&!window.claude){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
